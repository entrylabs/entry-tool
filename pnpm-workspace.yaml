# pnpm 10 부터 package.json 의 pnpm 필드를 읽지 않으므로 pnpm 설정은 이 파일에 둔다.
packages:
  - '.'

# 빌드에 필요 없는 install 스크립트는 실행하지 않는다.
allowBuilds:
  core-js: false
  es5-ext: false
  fsevents: false
  styled-components: false
  uglifyjs-webpack-plugin: false

# ajv 는 다른 패키지의 peer 범위까지 바뀌지 않도록 schema-utils 아래로만 건다.
overrides:
  'brace-expansion@^1': '^1.1.18'
  'cipher-base@^1': '^1.0.5'
  'cross-spawn@^7': '^7.0.5'
  'dompurify@^2': '^2.5.9'
  'elliptic@^6': '^6.6.1'
  'express@^4': '^4.20.0'
  'flatted@^3': '^3.4.2'
  'follow-redirects@^1': '^1.16.0'
  'form-data@^3': '^3.0.5'
  'immutable@^3': '^3.8.4'
  'immutable@^4': '^4.3.9'
  'js-yaml@^3': '^3.15.2'
  'js-yaml@^4': '^4.3.2'
  'lodash-es@^4': '^4.18.1'
  'lodash.template@^4': '^4.18.1'
  'min-document@^2': '^2.19.1'
  'minimatch@^3': '^3.1.4'
  'minimatch@^9': '^9.0.7'
  'nanoid@^3': '^3.3.18'
  'pbkdf2@^3': '^3.1.3'
  'picomatch@^2': '^2.3.2'
  'postcss-selector-parser@^6': '^6.1.3'
  'protocol-buffers-schema@^3': '^3.6.1'
  'qs@^6': '^6.16.0'
  'schema-utils@^4>ajv': '^8.18.0'
  'sha.js@^2': '^2.4.12'
  'shell-quote@^1': '^1.9.0'
  'websocket-driver@^0.7': '^0.7.5'
  'ws@^7': '^7.5.11'
  # 상위 패키지가 옛 버전을 고정하고 있어 메이저를 넘겨 올린다. 쓰는 API 는 같다.
  'cookie@^0.3': '^0.7.2'
  'cross-spawn@^5': '^6.0.6'
  'eventsource@^0.1': '^1.1.1'
  'json5@^0.5': '^1.0.2'
  'node-fetch@^1': '^2.6.7'
  'tmp@^0.0': '^0.2.6'
